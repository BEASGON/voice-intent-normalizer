name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run Ruff
        run: python -m ruff check src tests setup.py scripts/voice_intent.py
      - name: Run full test suite
        run: python -m pytest -q -p no:cacheprovider --basetemp "${{ runner.temp }}/vin-quality"
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Check out official skill validator
        uses: actions/checkout@v6
        with:
          repository: openai/skills
          path: .ci/openai-skills
      - name: Validate root skill
        run: |
          python -m pip install PyYAML==6.0.2
          python -X utf8 .ci/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py .

  python310:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run full test suite
        run: python -m pytest -q -p no:cacheprovider --basetemp "${{ runner.temp }}/vin-python310"

  coverage:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      COVERAGE_FILE: .coverage.${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run full test suite with parallel coverage
        run: >-
          python -m pytest -q -p no:cacheprovider
          --cov=voice_intent_normalizer
          --cov-report=
          --basetemp "${{ runner.temp }}/vin-coverage"
      - name: Upload platform coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-combine:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install coverage
        run: python -m pip install coverage>=7.6
      - name: Download platform coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Combine and enforce cross-platform coverage
        run: |
          python .github/scripts/combine_coverage.py coverage-data .coverage
          python -m coverage report --fail-under=90

  native-adapter:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run native adapter publication and journal tests
        run: >-
          python -m pytest
          tests/test_paths.py
          tests/test_installer.py
          tests/test_generic_layout.py
          -q
          -p no:cacheprovider
          --basetemp "${{ runner.temp }}/vin-native-adapter"
          -k "test_publish_directory_no_replace or
          test_publish_file_no_replace_exact or
          private_cleanup or
          exact_directory_move or
          posix_exact_publication or
          ownership_journal"

  fresh-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Run isolated fresh-wheel lifecycle
        run: >-
          python -m pytest
          tests/test_distribution_bundle.py::test_installed_wheel_default_installer_and_bootstrap_are_runnable
          -q
          -p no:cacheprovider
          --basetemp "${{ runner.temp }}/vin-fresh-wheel"
