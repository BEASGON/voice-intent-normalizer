[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-intent-normalizer"
version = "0.1.0"
description = "Validated lexicon models for Chinese voice-intent normalization."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
pinyin = ["pypinyin>=0.55,<1"]
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "pytest>=8.3",
    "ruff>=0.6",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/voice-intent-normalizer/docs" = ["docs/state-root-v1.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
